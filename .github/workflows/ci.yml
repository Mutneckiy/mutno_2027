name: Tests and application artifact

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -v
      - name: Save application artifact
        uses: actions/upload-artifact@v4
        with:
          name: mutno-2027
          if-no-files-found: error
          path: |
            app_final.py
            static/
            requirements.txt
            requirements-dev.txt
            test_app.py
            README.md
            .env.example
            deploy/
