<title id="title">Тихое солнце</title><desc id="desc">Береги энергию и делись теплом в своём ритме. В орнаменте 9 лепестков по числу пути; 3 кольца отражают выбранный источник сил. Метки на внешнем круге — Лев и Коза. Цвет задаёт выбранная стихия, а рисунок звёзд складывается из всей анкеты, включая имя и желание.</desc>
