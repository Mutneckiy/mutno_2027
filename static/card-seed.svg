<title id="title">Зерно перемен</title><desc id="desc">Большие изменения начинаются с маленького действия. В орнаменте 12 лепестков по числу пути; 3 кольца отражают выбранный источник сил. Метки на внешнем круге — Овен и Собака. Цвет задаёт выбранная стихия, а рисунок звёзд складывается из всей анкеты, включая имя и желание.</desc>
