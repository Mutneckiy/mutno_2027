<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 680" role="img" aria-labelledby="title desc">
<title id="title">Путеводная звезда</title><desc id="desc">Помни о своём направлении, даже когда путь ещё не виден. В орнаменте 11 лепестков по числу пути; 3 кольца отражают выбранный источник сил. Метки на внешнем круге — Весы и Лошадь. Цвет задаёт выбранная стихия, а рисунок звёзд складывается из всей анкеты, включая имя и желание.</desc>
